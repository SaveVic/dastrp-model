name: checks

on:
  push:
  pull_request:

jobs:
  release-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal deps
        run: pip install pillow
      - name: No private data / credentials / large files
        run: python tools/check_release.py
      - name: Byte-compile all sources
        run: python -m compileall -q models data scripts tools utils
